name: iOS build

on:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios-app && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios-app
          xcodebuild -project ProcessMakerApp.xcodeproj -target ProcessMaker \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/ProcessMaker.app || { grep -E "error" build.log | head -50; exit 1; }

      - name: Package .ipa
        run: |
          cd ios-app
          mkdir -p Payload
          cp -R build/Release-iphoneos/ProcessMaker.app Payload/
          zip -qry ProcessMaker.ipa Payload
          ls -la ProcessMaker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessMaker-ipa
          path: ios-app/ProcessMaker.ipa

      - name: Publish release "ios-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios-app/ProcessMaker.ipa \
            --target "${{ github.sha }}" --prerelease \
            --title "ProcessMaker для iPhone (сборка ${{ github.run_number }})" \
            --notes "Установка: см. ios-app/README.md (Sideloadly + Apple ID)."
